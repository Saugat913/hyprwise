name: Play Store Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      version_name:
        description: 'Custom Version Name override (e.g. 0.1.0 or 1.0.0)'
        required: false
        default: ''
      build_number:
        description: 'Custom Build Code override (integer, e.g. 1 or 100)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build & Release App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Quality & Tests
        run: |
          flutter analyze
          flutter test

      - name: Determine Version & Track
        id: versioning
        run: |
          # 1. Determine Track
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRACK="${{ github.event.inputs.track }}"
          else
            TAG_NAME="${{ github.ref_name }}"
            if [[ "$TAG_NAME" =~ ^v0\. ]]; then
              TRACK="internal"
            else
              TRACK="production"
            fi
          fi
          echo "track=$TRACK" >> $GITHUB_OUTPUT

          # 2. Determine Version Name
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.1.0"
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

          # 3. Determine Monotonic Version Code (Build Number)
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            VERSION_CODE="${{ github.event.inputs.build_number }}"
          elif [[ "$VERSION_NAME" =~ ^0\. ]]; then
            # Internal test baseline: uses run number (1, 2, 3...)
            VERSION_CODE="${{ github.run_number }}"
          else
            # Production builds reserve 100+ for version codes
            VERSION_CODE=$((100 + ${{ github.run_number }}))
          fi
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

          echo "=========================================="
          echo "Target Track: $TRACK"
          echo "Version Name: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"
          echo "=========================================="

      - name: Configure Android Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            mkdir -p android/app
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            cat <<EOF > android/key.properties
storePassword=$KEYSTORE_PASSWORD
keyPassword=$KEY_PASSWORD
keyAlias=$KEY_ALIAS
storeFile=../app/release.keystore
EOF
            echo "Signing keystore configured."
          else
            echo "Warning: ANDROID_KEYSTORE_BASE64 not set in GitHub secrets. Gradle will build using debug fallback."
          fi

      - name: Build Android App Bundle (.aab)
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.versioning.outputs.version_name }}" \
            --build-number="${{ steps.versioning.outputs.version_code }}"

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.versioning.outputs.version_name }}+${{ steps.versioning.outputs.version_code }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Deploy to Google Play Store
        if: env.PLAY_STORE_JSON_KEY != ''
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.hypr.hyprwise
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ steps.versioning.outputs.track }}
          status: completed
          mappingFile: build/app/outputs/mapping/release/mapping.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Hyprwise ${{ steps.versioning.outputs.version_name }}
          draft: false
          prerelease: ${{ steps.versioning.outputs.track == 'internal' }}
          files: |
            build/app/outputs/bundle/release/app-release.aab
          body: |
            ## Hyprwise Release ${{ steps.versioning.outputs.version_name }} (Build ${{ steps.versioning.outputs.version_code }})
            
            - **Google Play Track:** `${{ steps.versioning.outputs.track }}`
            - **Package Name:** `com.hypr.hyprwise`
            - **Build Code:** `${{ steps.versioning.outputs.version_code }}`
            
            ### Highlights
            - Multi-currency & multi-lingual financial intelligence
            - Advanced shift rate slider protocol with custom hourly rates and overtime multiplier
            - Real-time OCR bill scanner powered by Gemini 2.5 Flash
            - Local-first encrypted SQLite ledger with optional Cloud Sync
