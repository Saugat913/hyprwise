# ==============================================================================
# Codemagic CI/CD Configuration for Hyprwise (com.hypr.hyprwise)
# ==============================================================================
# Workflows:
#   1. internal-testing:   Triggered by dev branch and v0.* tags -> Play Store Internal track
#   2. production-release: Triggered by main branch, patch/*, and v1.* tags -> Play Store Production track
#   3. pr-verification:    Triggered by Pull Requests to main/dev -> Lint & Unit Test checks
# ==============================================================================

workflows:
  # ----------------------------------------------------------------------------
  # 1. Internal Testing Workflow (dev branch & v0.* tags)
  # ----------------------------------------------------------------------------
  internal-testing:
    name: Hyprwise Internal Testing (Play Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      groups:
        - google_play      # Contains: GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        - android_signing  # Contains: FCI_KEYSTORE, FCI_KEYSTORE_PASSWORD, FCI_KEY_ALIAS, FCI_KEY_PASSWORD
      vars:
        PACKAGE_NAME: "com.hypr.hyprwise"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'dev'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v0.*'
          include: true
    scripts:
      - name: Set up Android signing credentials
        script: |
          if [ -n "$FCI_KEYSTORE" ]; then
            echo "Configuring release keystore from Codemagic environment..."
            echo "$FCI_KEYSTORE" | base64 --decode > android/app/release.keystore
            cat <<EOF > android/key.properties
          storePassword=$FCI_KEYSTORE_PASSWORD
          keyPassword=$FCI_KEY_PASSWORD
          keyAlias=$FCI_KEY_ALIAS
          storeFile=../app/release.keystore
          EOF
          else
            echo "Warning: Release signing not configured in environment; debug signing will be used."
          fi
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Configure environment variables (.env)
        script: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -n "$SERVER_URL" ]; then
            sed -i "s|^SERVER_URL=.*|SERVER_URL=$SERVER_URL|" .env
          fi
          if [ -n "$REVENUECAT_GOOGLE_KEY" ]; then
            sed -i "s|^REVENUECAT_GOOGLE_KEY=.*|REVENUECAT_GOOGLE_KEY=$REVENUECAT_GOOGLE_KEY|" .env
          fi
      - name: Run Flutter Static Analysis
        script: flutter analyze
      - name: Run Flutter Unit & Integration Tests
        script: flutter test --dart-define-from-file=.env
      - name: Build Android App Bundle (.aab)
        script: |
          # Calculate monotonic build code
          BUILD_CODE=${BUILD_NUMBER:-1}
          flutter build appbundle --release \
            --dart-define-from-file=.env \
            --build-number=$BUILD_CODE
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
      email:
        recipients:
          - dev@hyprwise.app
        notify:
          failure: true

  # ----------------------------------------------------------------------------
  # 2. Production Release Workflow (main branch, patch/* branches & v1.* tags)
  # ----------------------------------------------------------------------------
  production-release:
    name: Hyprwise Production Release (Play Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      groups:
        - google_play      # Contains: GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        - android_signing  # Contains: FCI_KEYSTORE, FCI_KEYSTORE_PASSWORD, FCI_KEY_ALIAS, FCI_KEY_PASSWORD
      vars:
        PACKAGE_NAME: "com.hypr.hyprwise"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'patch'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v1.*'
          include: true
    scripts:
      - name: Set up Android signing credentials
        script: |
          if [ -n "$FCI_KEYSTORE" ]; then
            echo "Configuring release keystore..."
            echo "$FCI_KEYSTORE" | base64 --decode > android/app/release.keystore
            cat <<EOF > android/key.properties
          storePassword=$FCI_KEYSTORE_PASSWORD
          keyPassword=$FCI_KEY_PASSWORD
          keyAlias=$FCI_KEY_ALIAS
          storeFile=../app/release.keystore
          EOF
          else
            echo "Warning: FCI_KEYSTORE not detected; ensure signing is configured before uploading to Play Store."
          fi
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Configure environment variables (.env)
        script: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -n "$SERVER_URL" ]; then
            sed -i "s|^SERVER_URL=.*|SERVER_URL=$SERVER_URL|" .env
          fi
          if [ -n "$REVENUECAT_GOOGLE_KEY" ]; then
            sed -i "s|^REVENUECAT_GOOGLE_KEY=.*|REVENUECAT_GOOGLE_KEY=$REVENUECAT_GOOGLE_KEY|" .env
          fi
      - name: Run Flutter Static Analysis
        script: flutter analyze
      - name: Run Flutter Tests
        script: flutter test --dart-define-from-file=.env
      - name: Build Production Android App Bundle (.aab)
        script: |
          # Production build codes reserve 100+ to ensure monotonicity
          PROD_BUILD_CODE=$((100 + ${BUILD_NUMBER:-0}))
          flutter build appbundle --release \
            --dart-define-from-file=.env \
            --build-number=$PROD_BUILD_CODE
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
        submit_as_draft: true
      email:
        recipients:
          - dev@hyprwise.app
        notify:
          success: true
          failure: true

  # ----------------------------------------------------------------------------
  # 3. Pull Request Quality Gate (PRs to main or dev)
  # ----------------------------------------------------------------------------
  pr-verification:
    name: PR Quality Gate & Verification
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'dev'
          include: true
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Static Code Analysis
        script: flutter analyze
      - name: Unit & Widget Tests
        script: flutter test
      - name: Smoke Build (Debug AAB)
        script: flutter build appbundle --debug
