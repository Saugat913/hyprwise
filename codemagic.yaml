# ==============================================================================
# Codemagic CI/CD Configuration for Hyprwise (com.hypr.hyprwise)
# ==============================================================================
# Architecture:
#   - GitHub Actions: Builds Android (.aab) & publishes to Google Play Internal Testing.
#   - Codemagic: Dedicated strictly to iOS (.ipa) & publishes to App Store Connect / TestFlight.
# ==============================================================================

workflows:
  # ----------------------------------------------------------------------------
  # iOS Release Workflow (App Store Connect / TestFlight)
  # Triggered on release tags (v*.*.*) on main branch
  # ----------------------------------------------------------------------------
  ios-release:
    name: Hyprwise iOS Release (App Store Connect & TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials  # Contains: APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
        - app_config             # Contains: SERVER_URL, REVENUECAT_APPLE_KEY
      vars:
        BUNDLE_ID: "com.hypr.hyprwise"
        WIDGET_BUNDLE_ID: "com.hypr.hyprwise.HyprwiseWidgets"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    triggering:
      events:
        - tag
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
    scripts:
      - name: Set up iOS code signing with App Store Connect API
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter dependencies
        script: |
          flutter pub get
          flutter build ios --config-only --no-codesign
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Configure environment variables (.env)
        script: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -n "$SERVER_URL" ]; then
            sed -i '' "s|^SERVER_URL=.*|SERVER_URL=$SERVER_URL|" .env 2>/dev/null || sed -i "s|^SERVER_URL=.*|SERVER_URL=$SERVER_URL|" .env
          fi
          if [ -n "$REVENUECAT_APPLE_KEY" ]; then
            sed -i '' "s|^REVENUECAT_APPLE_KEY=.*|REVENUECAT_APPLE_KEY=$REVENUECAT_APPLE_KEY|" .env 2>/dev/null || sed -i "s|^REVENUECAT_APPLE_KEY=.*|REVENUECAT_APPLE_KEY=$REVENUECAT_APPLE_KEY|" .env
          fi
          if [ -n "$FIREBASE_IOS_API_KEY" ]; then
            sed -i '' "s|^FIREBASE_IOS_API_KEY=.*|FIREBASE_IOS_API_KEY=$FIREBASE_IOS_API_KEY|" .env 2>/dev/null || sed -i "s|^FIREBASE_IOS_API_KEY=.*|FIREBASE_IOS_API_KEY=$FIREBASE_IOS_API_KEY|" .env
          fi
      - name: Run Flutter Static Analysis
        script: flutter analyze
      - name: Run Flutter Unit & Widget Tests
        script: flutter test --dart-define-from-file=.env
      - name: Build iOS App (.ipa)
        script: |
          BUILD_CODE=${BUILD_NUMBER:-1}
          flutter build ipa --release \
            --dart-define-from-file=.env \
            --build-number=$BUILD_CODE \
            --export-options-plist=/Users/builder/export_options.plist
          touch /tmp/BUILD_SUCCESS
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - dev@hyprwise.app
        notify:
          success: true
          failure: true
