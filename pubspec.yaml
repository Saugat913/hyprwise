name: finance_tracker
description: "Hyprwise - Offline-first personal finance planner & shift manager."
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  get_it: ^8.2.0
  go_router: ^16.2.1
  hugeicons: ^1.2.0
  flutter_svg: ^2.2.0
  intl: any
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  csv: ^8.0.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_auth: ^6.7.0
  google_sign_in: ^6.2.2
  purchases_flutter: ^8.5.0
  file_picker: ^10.2.4
  pdf: ^3.13.1
  http: ^1.6.0
  flutter_markdown: ^0.7.7+1
  purchases_ui_flutter: ^8.11.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  drift_dev: ^2.28.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans.ttf
    - family: RedditMono
      fonts:
        - asset: assets/fonts/RedditMono.ttf
  assets:
    - assets/icons/merchants/
    - assets/icons/
    - assets/brand/
    - assets/brand/logo/
    - assets/brand/app-icon/
    - assets/brand/android/
    - assets/brand/web/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app-icon/hyprwise-app-icon-1024.png"
  image_path_ios: "assets/brand/app-icon/hyprwise-app-icon-ios-1024.png"
  adaptive_icon_background: "assets/brand/android/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/brand/android/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/brand/android/ic_launcher_monochrome.png"
  remove_alpha_ios: true
  min_sdk_android: 23

flutter_native_splash:
  color: "#F6FBF8"
  color_dark: "#0C1210"
  image: assets/brand/android/splash-light-icon.png
  image_dark: assets/brand/android/splash-dark-icon.png
  branding: assets/brand/android/branding-light.png
  branding_dark: assets/brand/android/branding-dark.png
  branding_mode: bottom
  android_12:
    color: "#F6FBF8"
    color_dark: "#0C1210"
    image: assets/brand/android/splash-light-icon.png
    image_dark: assets/brand/android/splash-dark-icon.png
    branding: assets/brand/android/branding-light.png
    branding_dark: assets/brand/android/branding-dark.png
